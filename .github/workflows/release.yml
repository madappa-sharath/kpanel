name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # goreleaser publishes the GitHub Release
      id-token: write  # cosign keyless signing + attestation signing via GitHub OIDC
      attestations: write  # actions/attest-build-provenance stores attestations
      packages: write  # push the container image to GHCR
    env:
      # Reject runs that would mutate go.mod/go.sum.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Keep this before dependency installs. Socket Firewall Free guards
      # supported package-manager downloads from malicious package artifacts.
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      # Source tarball for the Homebrew formula, which builds with Go only
      # (no Bun in the sandbox), so we ship a pre-built frontend inside it.
      - name: Build frontend
        run: cd web && sfw bun install --frozen-lockfile && bun build.ts

      - name: Create source tarball with pre-built frontend
        run: |
          mkdir -p server/cmd/kpanel/public
          cp -r web/dist/. server/cmd/kpanel/public/
          TAG=${GITHUB_REF_NAME}
          TARBALL="/tmp/kpanel-src-${TAG}.tar.gz"
          tar czf "$TARBALL" \
            --transform "s|^|kpanel-${TAG}/|" \
            server/
          echo "SRC_TARBALL=$TARBALL" >> $GITHUB_ENV

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for each release archive. install.sh/install.ps1
      # check it with `gh attestation verify`, which ties the archive to this
      # repo and this workflow (checksums.txt alone can be swapped with it).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/kpanel_*.tar.gz
            dist/kpanel_*.zip

      # Container image. It is built from the attested linux archives, so the
      # image runs the same binary that the archive attestations cover. Only
      # the version tag is pushed here; promote-image.yml moves :latest after
      # the release has been public for 72h, the same delay as update offers.
      - name: Prepare image build context
        run: |
          CTX="$RUNNER_TEMP/image"
          mkdir -p "$CTX/config"
          cp Dockerfile "$CTX/"
          for arch in amd64 arm64; do
            mkdir -p "$CTX/linux/$arch"
            tar xzf "dist/kpanel_linux_${arch}.tar.gz" -C "$CTX/linux/$arch" kpanel
          done
          echo "IMAGE_CTX=$CTX" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit provenance and SBOM are stored with the image in GHCR.
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ env.IMAGE_CTX }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.description=kpanel, a local Kafka GUI

      # GitHub attestation for the image index, so users can run
      # `gh attestation verify oci://ghcr.io/...` like they do for archives.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Upload source tarball to release
        run: gh release upload ${{ github.ref_name }} ${{ env.SRC_TARBALL }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser creates the release as a draft. Publish it last, after the
      # attestations and all assets exist.
      - name: Publish release
        run: gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
