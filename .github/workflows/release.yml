name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # goreleaser publishes the GitHub Release
      id-token: write  # cosign keyless signing + attestation signing via GitHub OIDC
      attestations: write  # actions/attest-build-provenance stores attestations
    env:
      # Reject runs that would mutate go.mod/go.sum.
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Keep this before dependency installs. Socket Firewall Free guards
      # supported package-manager downloads from malicious package artifacts.
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2

      # Source tarball for the Homebrew formula, which builds with Go only
      # (no Bun in the sandbox), so we ship a pre-built frontend inside it.
      - name: Build frontend
        run: cd web && sfw bun install --frozen-lockfile && bun build.ts

      - name: Create source tarball with pre-built frontend
        run: |
          mkdir -p server/cmd/kpanel/public
          cp -r web/dist/. server/cmd/kpanel/public/
          TAG=${GITHUB_REF_NAME}
          TARBALL="/tmp/kpanel-src-${TAG}.tar.gz"
          tar czf "$TARBALL" \
            --transform "s|^|kpanel-${TAG}/|" \
            server/
          echo "SRC_TARBALL=$TARBALL" >> $GITHUB_ENV

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for each release archive. install.sh/install.ps1
      # check it with `gh attestation verify`, which ties the archive to this
      # repo and this workflow (checksums.txt alone can be swapped with it).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/kpanel_*.tar.gz
            dist/kpanel_*.zip

      - name: Upload source tarball to release
        run: gh release upload ${{ github.ref_name }} ${{ env.SRC_TARBALL }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser creates the release as a draft. Publish it last, after the
      # attestations and all assets exist.
      - name: Publish release
        run: gh release edit ${{ github.ref_name }} --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
