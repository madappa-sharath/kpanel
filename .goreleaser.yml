version: 2

before:
  hooks:
    # web/dist is built by the release workflow (sfw bun install
    # --frozen-lockfile && bun build.ts). Do not install or rebuild here: a
    # second install would bypass sfw and the lockfile check. Locally, run
    # `make build` (or `cd web && bun build.ts`) before goreleaser.
    - bash -c "test -f web/dist/index.html || { echo 'web/dist not found, build the frontend first' >&2; exit 1; }"
    - bash -c "rm -rf server/cmd/kpanel/public && cp -r web/dist server/cmd/kpanel/public"

builds:
  - id: kpanel
    dir: server
    main: ./cmd/kpanel
    binary: kpanel
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "kpanel_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# CycloneDX SBOM per archive — lets downstream consumers verify what was bundled.
sboms:
  - artifacts: archive

# Keyless cosign signing using GitHub OIDC (no key management needed).
# cosign v2 defaults to bundle output; we write it explicitly to avoid
# deprecated flag behavior across runner/cosign versions.
# Verify with:
#   cosign verify-blob --certificate-identity-regexp \
#     'https://github.com/<owner>/kpanel/.github/workflows/release.yml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --bundle <artifact>.sigstore.json <artifact>
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${artifact}.sigstore.json"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

release:
  # Created as a draft; the release workflow publishes it only after the
  # attestations and the source tarball exist, so no user can download an
  # archive that has no attestation yet.
  draft: true
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
